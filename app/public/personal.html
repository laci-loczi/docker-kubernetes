<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K8s Cluster</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/socket.io/socket.io.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>   
        <div class="controls">
            <a href="index.html">
                <button class="btn-tech">
                    <i class="fas fa-back"></i>Back
                </button>
            </a>
    </header>
    <section style="margin-top: 40px; margin-bottom: 40px; width: 100%;">
        <div class="card" style="background: var(--card-bg); border-color: var(--border-color);">
            <div class="control-panel" style="border: 2px solid #3b82f6; background: rgba(59, 130, 246, 0.05); margin-top: 20px;">
                <h3 style="color: #3b82f6;"><i class="fas fa-bolt"></i> DeepL </h3>
                <input type="password" id="deeplPassword" placeholder="Admin Jelszó" style="width: 100%; padding: 8px; margin-bottom: 10px; border-radius: 4px; border: 1px solid var(--border-color); background: var(--bg-dark); color: white;">
                <input type="file" id="deeplSrtInput" accept=".srt" class="file-input">
                <button id="deeplTranslateBtn" class="btn-primary" style="margin-top: 10px; width: 100%; background: #3b82f6; color: white;">DeepL Fordítás Indítása</button>
                <div id="deeplSubStatus" class="status-text" style="margin-top: 10px;">Várakozás...</div>
            </div>

            <div class="control-panel" style="border: 2px solid #10b981; background: rgba(16, 185, 129, 0.05); margin-top: 20px;">
                <h3 style="color: #10b981;"><i class="fas fa-magic"></i> Gemini</h3>
                <input type="password" id="geminiPassword" placeholder="Admin Jelszó" style="width: 100%; padding: 8px; margin-bottom: 10px; border-radius: 4px; border: 1px solid var(--border-color); background: var(--bg-dark); color: white;">
                <input type="file" id="geminiSrtInput" accept=".srt" class="file-input">
                <button id="geminiTranslateBtn" class="btn-primary" style="margin-top: 10px; width: 100%; background: #10b981; color: white;">Gemini Fordítás Indítása</button>
                <div id="geminiSubStatus" class="status-text" style="margin-top: 10px;">Várakozás...</div>
            </div>
        </div>
    </section>

    <section style="margin-top: 40px; margin-bottom: 40px; width: 100%;">
        <div class="card" style="background: var(--card-bg); border-color: var(--border-color);">
            <div class="card-header" style="margin-bottom: 15px;">
                <div>
                    <div class="card-title">K8s AI Guitar Tracker (Polyphonic AMT)</div>
                    <div style="font-size: 0.85rem; color: var(--text-muted); margin-top: 5px;">
                        Upload a guitar track. Python AI Workers extract the notes, Node.js delivers them real-time!
                    </div>
                </div>
                <i class="fas fa-guitar" style="color: #f43f5e; font-size: 1.5rem;"></i>
            </div>
            
            <div style="display: flex; gap: 15px; align-items: center; flex-wrap: wrap; margin-bottom: 20px;">
                <input type="file" id="guitarInput" accept=".wav,.mp3" style="background: var(--bg-color); color: var(--text-main); padding: 8px; border-radius: 6px; border: 1px solid var(--border-color); cursor: pointer;">
                <button id="analyzeGuitarBtn" style="background: #f43f5e; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.2s; box-shadow: 0 0 10px rgba(244, 63, 94, 0.4);">
                    <i class="fas fa-bolt"></i> Generate TAB
                </button>
                <div id="guitarStatus" style="color: var(--text-muted); font-size: 0.9rem; font-family: monospace;">Waiting for track...</div>
            </div>

            <div style="position: relative; width: 100%; border-radius: 8px; overflow: hidden; border: 2px solid var(--border-color); background: #000;">
                <canvas id="guitarCanvas" width="800" height="400" style="width: 100%; display: block;"></canvas>
            </div>
            
            <audio id="guitarAudio" controls style="width: 100%; margin-top: 15px; outline: none; border-radius: 6px;"></audio>
        </div>
    </section>
    
        
    
    <script src="script.js"></script>
</body>
</html>
